<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Kepler routing demonstration</title>
  <desc id="description">An animated request moves through owner resolution, exact project verification, task dispatch, and a receipt that stops without monitoring.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030611"/>
      <stop offset="0.48" stop-color="#071126"/>
      <stop offset="1" stop-color="#160b2b"/>
    </linearGradient>
    <radialGradient id="nebula-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1b9cc5" stop-opacity="0.24"/>
      <stop offset="0.42" stop-color="#17678f" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#071126" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7650d8" stop-opacity="0.23"/>
      <stop offset="0.46" stop-color="#442582" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#160b2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="galaxy-arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a6f92" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#7fdfff" stop-opacity="0.3"/>
      <stop offset="0.65" stop-color="#ad91ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6841b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28d7d0"/>
      <stop offset="0.55" stop-color="#2aa8ff"/>
      <stop offset="1" stop-color="#8b6cff"/>
    </linearGradient>
    <linearGradient id="active-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14283d"/>
      <stop offset="1" stop-color="#171a38"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020713" flood-opacity="0.75"/>
    </filter>
    <style>
      .eyebrow {
        fill: #79a8c9;
        font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 2.4px;
      }
      .headline {
        fill: #f2f8ff;
        font: 700 25px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.2px;
      }
      .step {
        fill: #72a2c5;
        font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 1.5px;
      }
      .label {
        fill: #f4f8ff;
        font: 700 17px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .detail {
        fill: #9ab3c8;
        font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .receipt-key {
        fill: #7896ae;
        font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.4px;
      }
      .receipt-value {
        fill: #dfeeff;
        font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .card {
        animation: card-pulse 8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .card-2 { animation-delay: 1.35s; }
      .card-3 { animation-delay: 2.7s; }
      .card-4 { animation-delay: 4.05s; }
      .card-5 { animation-delay: 5.4s; }
      .route-dash {
        stroke-dasharray: 10 12;
        animation: route-flow 1.2s linear infinite;
      }
      .stop-light {
        animation: stop-pulse 2.2s ease-in-out infinite;
      }
      .star {
        fill: #d9eeff;
        animation: twinkle 5.6s ease-in-out infinite;
      }
      .star-violet { fill: #c9b9ff; }
      .star-cyan { fill: #9defff; }
      .star-dim { opacity: 0.34; }
      .star-mid { opacity: 0.58; }
      .twinkle-2 { animation-delay: -1.9s; }
      .twinkle-3 { animation-delay: -3.7s; }
      @keyframes route-flow {
        to { stroke-dashoffset: -44; }
      }
      @keyframes card-pulse {
        0%, 12%, 100% { opacity: 0.72; transform: translateY(0); }
        4%, 8% { opacity: 1; transform: translateY(-5px); }
      }
      @keyframes stop-pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.28; }
        50% { opacity: 0.9; }
      }
      @media (prefers-reduced-motion: reduce) {
        .card, .route-dash, .stop-light, .star { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="430" rx="24" fill="url(#background)"/>

  <g aria-hidden="true">
    <ellipse cx="330" cy="98" rx="355" ry="190" fill="url(#nebula-cyan)" transform="rotate(-12 330 98)"/>
    <ellipse cx="930" cy="330" rx="390" ry="220" fill="url(#nebula-violet)" transform="rotate(-16 930 330)"/>

    <g fill="none" transform="rotate(-10 600 215)">
      <ellipse cx="600" cy="215" rx="522" ry="142" stroke="url(#galaxy-arm)" stroke-width="1.3" opacity="0.42"/>
      <ellipse cx="600" cy="215" rx="410" ry="106" stroke="url(#galaxy-arm)" stroke-width="1" opacity="0.32"/>
      <path d="M95 252 C265 101 456 137 600 215 C744 293 935 329 1105 178" stroke="url(#galaxy-arm)" stroke-width="15" opacity="0.1"/>
      <path d="M175 333 C346 270 442 119 600 215 C758 311 854 160 1025 97" stroke="url(#galaxy-arm)" stroke-width="7" opacity="0.09"/>
    </g>

    <g>
      <circle class="star star-dim" cx="42" cy="72" r="1.2"/>
      <circle class="star star-mid twinkle-2" cx="89" cy="44" r="1.4"/>
      <circle class="star star-cyan twinkle-3" cx="146" cy="91" r="1.1"/>
      <circle class="star star-dim twinkle-2" cx="205" cy="38" r="0.9"/>
      <circle class="star star-violet" cx="274" cy="103" r="1.3"/>
      <circle class="star star-mid twinkle-3" cx="338" cy="54" r="1.1"/>
      <circle class="star star-cyan twinkle-2" cx="403" cy="92" r="1.5"/>
      <circle class="star star-dim" cx="468" cy="31" r="0.9"/>
      <circle class="star star-violet twinkle-3" cx="535" cy="112" r="1.2"/>
      <circle class="star star-mid" cx="612" cy="48" r="1.3"/>
      <circle class="star star-cyan twinkle-2" cx="680" cy="97" r="0.9"/>
      <circle class="star star-dim twinkle-3" cx="752" cy="35" r="1.1"/>
      <circle class="star star-violet" cx="818" cy="91" r="1.5"/>
      <circle class="star star-mid twinkle-2" cx="882" cy="51" r="1"/>
      <circle class="star star-cyan twinkle-3" cx="955" cy="107" r="1.3"/>
      <circle class="star star-dim" cx="1028" cy="42" r="0.9"/>
      <circle class="star star-violet twinkle-2" cx="1105" cy="88" r="1.2"/>
      <circle class="star star-mid twinkle-3" cx="1162" cy="47" r="1.4"/>

      <circle class="star star-dim twinkle-3" cx="31" cy="337" r="1"/>
      <circle class="star star-cyan" cx="105" cy="303" r="1.2"/>
      <circle class="star star-mid twinkle-2" cx="177" cy="371" r="1.5"/>
      <circle class="star star-violet twinkle-3" cx="252" cy="319" r="1"/>
      <circle class="star star-dim" cx="326" cy="399" r="1.1"/>
      <circle class="star star-cyan twinkle-2" cx="398" cy="338" r="1.3"/>
      <circle class="star star-mid" cx="473" cy="389" r="0.9"/>
      <circle class="star star-violet twinkle-3" cx="546" cy="320" r="1.4"/>
      <circle class="star star-dim twinkle-2" cx="625" cy="401" r="1"/>
      <circle class="star star-cyan" cx="702" cy="333" r="1.2"/>
      <circle class="star star-mid twinkle-3" cx="778" cy="394" r="1.5"/>
      <circle class="star star-violet twinkle-2" cx="851" cy="326" r="0.9"/>
      <circle class="star star-dim" cx="924" cy="402" r="1.1"/>
      <circle class="star star-cyan twinkle-3" cx="997" cy="339" r="1.4"/>
      <circle class="star star-mid" cx="1074" cy="389" r="1"/>
      <circle class="star star-violet twinkle-2" cx="1153" cy="321" r="1.3"/>
    </g>

    <g stroke="#8ccce8" stroke-width="0.75" opacity="0.26">
      <path d="M1056 63 L1080 77 L1108 58 L1132 79"/>
      <circle cx="1056" cy="63" r="2.2" fill="#a4efff"/>
      <circle cx="1080" cy="77" r="1.8" fill="#d8efff"/>
      <circle cx="1108" cy="58" r="2.4" fill="#c8b8ff"/>
      <circle cx="1132" cy="79" r="1.7" fill="#d8efff"/>
    </g>
  </g>

  <path d="M0 112 C210 45 425 165 640 82 C835 7 1005 82 1200 25" fill="none" stroke="#1a3450" stroke-width="1" opacity="0.6"/>
  <path d="M0 390 C220 325 448 448 675 367 C894 289 1055 382 1200 320" fill="none" stroke="#242954" stroke-width="1" opacity="0.75"/>

  <text x="54" y="48" class="eyebrow">LIVE ROUTING TOUR</text>
  <text x="54" y="82" class="headline">Ask once. Route exactly. Stop cleanly.</text>
  <text x="1144" y="65" text-anchor="end" class="detail">one request → one verified owner</text>

  <path id="motion-route" d="M150 208 C245 208 255 208 350 208 S455 208 550 208 S655 208 750 208 S855 208 950 208"
        fill="none" stroke="#214661" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 208 C245 208 255 208 350 208 S455 208 550 208 S655 208 750 208 S855 208 950 208"
        class="route-dash" fill="none" stroke="url(#route)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <circle r="7" fill="#f7fbff" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M150 208 C245 208 255 208 350 208 S455 208 550 208 S655 208 750 208 S855 208 950 208"/>
    <animate attributeName="fill" values="#28d7d0;#2aa8ff;#8b6cff;#28d7d0" dur="8s" repeatCount="indefinite"/>
  </circle>

  <g class="card card-1" filter="url(#soft-shadow)">
    <rect x="54" y="128" width="192" height="160" rx="16" fill="url(#active-card)" stroke="#24506b"/>
    <circle cx="86" cy="160" r="15" fill="#15384a" stroke="#28d7d0"/>
    <path d="M79 156h14M79 161h10M79 166h7" stroke="#7df3ea" stroke-width="2" stroke-linecap="round"/>
    <text x="112" y="157" class="step">STEP 01</text>
    <text x="76" y="207" class="label">You ask</text>
    <text x="76" y="235" class="detail">“Patch the API”</text>
    <text x="76" y="258" class="detail">scope stays intact</text>
  </g>

  <g class="card card-2" filter="url(#soft-shadow)">
    <rect x="254" y="128" width="192" height="160" rx="16" fill="url(#active-card)" stroke="#24506b"/>
    <circle cx="286" cy="160" r="15" fill="#15384a" stroke="#28d7d0"/>
    <path d="M280 153v14M280 156h10M290 156v11M280 164h10" fill="none" stroke="#7df3ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="312" y="157" class="step">STEP 02</text>
    <text x="276" y="207" class="label">Resolve owner</text>
    <text x="276" y="235" class="detail">workload: development</text>
    <text x="276" y="258" class="detail">owner: example-api</text>
  </g>

  <g class="card card-3" filter="url(#soft-shadow)">
    <rect x="454" y="128" width="192" height="160" rx="16" fill="url(#active-card)" stroke="#2c4e78"/>
    <circle cx="486" cy="160" r="15" fill="#152e4f" stroke="#2aa8ff"/>
    <path d="M480 160l4 4 8-9" fill="none" stroke="#8ed7ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="512" y="157" class="step">STEP 03</text>
    <text x="476" y="207" class="label">Verify project</text>
    <text x="476" y="235" class="detail">exact path matched</text>
    <text x="476" y="258" class="detail">runtime ID confirmed</text>
  </g>

  <g class="card card-4" filter="url(#soft-shadow)">
    <rect x="654" y="128" width="192" height="160" rx="16" fill="url(#active-card)" stroke="#423f79"/>
    <circle cx="686" cy="160" r="15" fill="#272552" stroke="#8b6cff"/>
    <path d="M679 160h12M687 155l5 5-5 5" fill="none" stroke="#c2b4ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="712" y="157" class="step">STEP 04</text>
    <text x="676" y="207" class="label">Create or resume</text>
    <text x="676" y="235" class="detail">matching objective found</text>
    <text x="676" y="258" class="detail">task receipt returned</text>
  </g>

  <g class="card card-5" filter="url(#soft-shadow)">
    <rect x="854" y="128" width="292" height="160" rx="16" fill="url(#active-card)" stroke="#5a487d"/>
    <circle cx="886" cy="160" r="15" fill="#30264f" stroke="#e4a957"/>
    <path d="M880 160l4 4 8-9" fill="none" stroke="#ffd697" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="912" y="157" class="step">RECEIPT</text>
    <text x="876" y="202" class="receipt-key">project</text>
    <text x="948" y="202" class="receipt-value">example-api</text>
    <text x="876" y="225" class="receipt-key">task</text>
    <text x="948" y="225" class="receipt-value">task_01H…</text>
    <text x="876" y="248" class="receipt-key">mode</text>
    <text x="948" y="248" class="receipt-value">worktree</text>
    <text x="876" y="271" class="receipt-key">monitor</text>
    <text x="948" y="271" class="receipt-value">stopped</text>
  </g>

  <rect x="54" y="326" width="1092" height="58" rx="14" fill="#091522" stroke="#1d3850"/>
  <circle class="stop-light" cx="82" cy="355" r="6" fill="#e4a957" filter="url(#glow)"/>
  <text x="102" y="359" class="detail">Coordinator boundary preserved</text>
  <path d="M320 343v24" stroke="#29435a"/>
  <text x="344" y="359" class="detail">repositories stay separate</text>
  <path d="M584 343v24" stroke="#29435a"/>
  <text x="608" y="359" class="detail">approval gates stay explicit</text>
  <path d="M888 343v24" stroke="#29435a"/>
  <text x="912" y="359" class="detail">no background monitoring</text>

  <text x="54" y="414" class="eyebrow">KEPLER • PORTABLE MULTI-PROJECT COORDINATION</text>
</svg>
