api_version: kepler.dev/v1alpha1
kind: KeplerRegistry
schema: hub/schemas/kepler.schema.json

metadata:
  name: kepler
  description: Portable project coordination, architecture, routing, and safety policy.

workspace:
  root: "__KEPLER_ROOT__"
  coordination_project_key: kepler
  architecture_map: hub/architecture-map.yaml
  plans_root: hub/plans
  context_packs_root: hub/context-packs
  worker_results_root: hub/worker-results
  memory_root: hub/memory
  dispatch_receipts_root: hub/dispatch-receipts
  report_root: hub/reports
  policy_root: docs
  local_registry: hub/state/repositories.yaml
  bridge_registry: hub/state/bridges.yaml
  repository_declarations: hub/repositories.yaml
  project_registry: hub/state/projects.yaml
  bridge_setup_receipt: hub/state/bridge-repos.json
  implementation_policy: selected_project_only
  runtime_state_policy: structured_coordination_state

# Existing saved Codex projects are selected during /kepler setup. Kepler does
# not create workload folders, clone roots, or pseudo-projects.
workloads: {}
repositories: {}

codex_projects:
  kepler:
    display_name: Kepler control project
    context: local
    path: "__KEPLER_ROOT__"
    role: coordination
    required: true

providers:
  github:
    kind: github
    host: github.com
    locator_format: namespace/name
    metadata_tool: gh
    clone_transport: git
  gitlab:
    kind: gitlab
    host: gitlab.com
    locator_format: namespace/name
    metadata_tool: glab
    clone_transport: git
  bitbucket:
    kind: bitbucket
    host: bitbucket.org
    locator_format: workspace/name
    metadata_tool: api_or_git
    clone_transport: git
  git:
    kind: git
    locator_format: absolute_git_url
    metadata_tool: git
    clone_transport: git
  existing-local:
    kind: existing_local
    locator_format: absolute_path
    metadata_tool: git
    clone_transport: none
environments: {}

automation_templates:
  root: hub/automations
  activation_policy: explicit_user_enablement
  default_enabled: false

routing:
  default_coordination_project_key: kepler
  planner_runtime:
    role: sol
    model: gpt-5.6-sol
    thinking: high
  dispatcher_runtime:
    role: terra
    model: gpt-5.6-terra
    thinking: high
  task_launch_policy: explicit_kepler_dispatch
  dispatch_receipt_policy: required
  post_dispatch_policy: return_receipt_without_monitoring
  monitoring_policy: user_initiated_only
  existing_task_policy: resume_exact_match
  project_registration_policy: existing_saved_projects_exact_path
  bridge_policy: optional_advanced_fail_closed_when_configured
  mode_defaults:
    read_only: local
    repository_implementation: worktree
    runtime_validation: local
    coordination: local
